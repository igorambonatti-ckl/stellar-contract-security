[package]
name = "soroban-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# **`lib` only, deliberately — `cdylib` is requested per-build instead.**
#
# `crate-type = ["lib", "cdylib"]` is one Cargo target emitting two artifacts,
# so every build produces both. Under `cargo-fuzz`'s SanitizerCoverage flags the
# cdylib link fails on macOS/arm64 — the contract's `__*__invoke_raw` shims are
# dropped by `-dead_strip` while the exported-symbols list still demands them —
# and that failure blocks the whole fuzz build even though the fuzz target only
# ever needs the rlib.
#
# The `.wasm` artifact is therefore produced on demand:
#
#   cargo rustc -p soroban-vault --target wasm32v1-none --release --crate-type cdylib
#
# See `results/p6-fuzzing.md` § "The cdylib/sancov collision".
crate-type = ["lib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"
proptest-arbitrary-interop = "0.1.0"
arbitrary = { version = "1.3", features = ["derive"] }

[features]
# Seeded bugs (P3). Each violates exactly one invariant and is toggled
# independently, so the benchmark can measure per-bug detection.
# The clean build enables none of them.
bug_overflow = []
bug_missing_auth = []
bug_zero_amount = []
bug_self_transfer = []
bug_no_ttl = []
bug_temp_nonce = []
bug_reinit = []
